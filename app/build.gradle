plugins {
    id 'com.android.application'
}

// Keep the existing install identity while producing a non-debuggable distribution build.
// The original development signing key lives outside Git; this is not a Play App Signing key.
def preservedStore = new File(System.getenv('ANDROID_USER_HOME')
        ?: rootProject.file('../.myfinancehub-tools/android-user').absolutePath, 'debug.keystore')

android {
    namespace 'br.com.myfinancehub'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.myfinancehub'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '0.6.1'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        preserved {
            storeFile preservedStore
            // Android's standard development-key credentials, not provider or user secrets.
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            debuggable false
            signingConfig signingConfigs.preserved
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}

tasks.withType(Test).configureEach {
    // Isolate Robolectric's cache and download lock from the machine user's home.
    def robolectricHome = new File(gradle.gradleUserHomeDir, 'robolectric-home')
    systemProperty 'user.home', robolectricHome.absolutePath
    doFirst {
        robolectricHome.mkdirs()
    }
    // Robolectric resolves its Android runtime in a separate worker JVM.
    ['http.proxyHost', 'http.proxyPort', 'https.proxyHost', 'https.proxyPort',
     'http.nonProxyHosts', 'javax.net.ssl.trustStore', 'javax.net.ssl.trustStorePassword'].each { key ->
        if (System.getProperty(key)) {
            systemProperty key, System.getProperty(key)
        }
    }
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
}
